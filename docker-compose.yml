services:

  # ── Backend ASP.NET Core ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/FitCore.Api/Dockerfile
    container_name: fitcore_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=aws-1-us-east-1.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.uglowihvljfqbpshziwg;Password=${SUPABASE_PASSWORD};SSL Mode=Require;Trust Server Certificate=true"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: FitCoreApi
      JwtSettings__Audience: FitCoreClient
      JwtSettings__ExpirationDays: 7
      MercadoPago__AccessToken: ${MERCADOPAGO_ACCESS_TOKEN}
      MercadoPago__PublicKey: ${MERCADOPAGO_PUBLIC_KEY}
      Cors__Origins__0: "https://fit-core-delta.vercel.app"
      Cors__Origins__1: "http://localhost:5173"
    ports:
      - "5192:8080"
