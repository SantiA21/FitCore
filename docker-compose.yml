services:

  # ── Base de datos PostgreSQL local ──────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: fitcore_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Mapeamos al 5433 del host para no colisionar con un Postgres local instalado
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Backend ASP.NET Core ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/FitCore.Api/Dockerfile
    container_name: fitcore_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: FitCoreApi
      JwtSettings__Audience: FitCoreClient
      JwtSettings__ExpirationDays: 7
    ports:
      - "5192:8080"

volumes:
  pgdata:
